[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=25MB
pidfile=/var/run/supervisord.pid
nodaemon=true
user=root

; build: lays out this coin's config files (blockbook itself is in the image).
; bootstrap: seeds an empty or far-behind instance from a synced peer of the
; same Flux app. daemon and blockbook wait for both before starting.
[program:build]
command=bash -c "/build.sh"
user=root
priority=1
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/root/build.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:bootstrap]
command=bash -c "/snapshot.sh restore"
user=root
priority=2
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/root/bootstrap.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:daemon]
command=bash -c "/daemon.sh"
user=root
stdout_logfile=/root/backend.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=0
redirect_stderr=true
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=300
startsecs=5
startretries=1000

[program:blockbook]
command=bash -c "/blockbook.sh"
user=root
stopasgroup=true
stopwaitsecs=120
stdout_logfile=/root/blockbook.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=0
redirect_stderr=true
autostart=true
autorestart=true
startsecs=5
startretries=1000

[program:consensus]
command=bash -c "/consensus.sh"
user=root
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=0
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0

[program:snapshot_server]
command=python3 /snapshot_server.py
user=root
stdout_logfile=/root/snapshot_server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
autostart=true
autorestart=true

[program:crond]
command=bash -c "printenv | grep -v '^_=' > /etc/environment && /usr/sbin/cron -f"
user=root
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
autostart=true
autorestart=true
startsecs=10
